# Example: check the training content summary of a model repository on every
# pull request. Copy to .github/workflows/training-summary.yml.
name: Training content summary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pin the action to a full commit SHA of a release.
      - uses: afkzonagroup/sourcebook@<commit-sha>
        with:
          summary: training-content-summary.yaml
          strict: 'false'
